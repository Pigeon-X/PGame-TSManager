name: Build PGame-TSManager

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'PGame-TSManager/PGame-TSManager.csproj'
          $version = [string]($project.Project.PropertyGroup |
            ForEach-Object { $_.Version } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '0.0.0' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore PGame-TSManager.sln

      - name: Build
        run: dotnet build PGame-TSManager.sln -c Release --no-restore

      - name: Publish self-contained manager
        run: >-
          dotnet publish PGame-TSManager/PGame-TSManager.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -o artifacts/manager

      - name: Prepare TShock runtime
        shell: pwsh
        run: |
          ./maintenance/tools/Prepare-TShockRuntime.ps1 `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts/manager/Core')

      - name: Generate package usage and update notes
        shell: pwsh
        run: |
          ./maintenance/tools/New-PackageExtras.ps1 `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts/package-extras') `
            -Version '${{ steps.version.outputs.version }}' `
            -Commit '${{ github.sha }}' `
            -RunNumber '${{ github.run_number }}' `
            -Repository '${{ github.repository }}'

      - name: Package source-only maintenance bundle
        shell: pwsh
        run: |
          ./maintenance/tools/New-SourceBundle.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts/PGame-TSManager-source.zip')

      - name: Package manager template
        shell: pwsh
        run: |
          ./maintenance/tools/New-ReleaseBundle.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -PublishDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts/manager') `
            -RuntimeDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts/manager/Core') `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts/PGame-TSManager-template.zip')

      - name: Package universal manager bundle
        shell: pwsh
        run: |
          ./maintenance/tools/New-UniversalBundle.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -PublishDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts/manager') `
            -RuntimeDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts/manager/Core') `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts/PGame-TSManager-universal.zip')

      - name: Add usage and update notes to packages
        shell: pwsh
        run: |
          $archives = @(
            (Join-Path $env:GITHUB_WORKSPACE 'artifacts/PGame-TSManager-source.zip')
            (Join-Path $env:GITHUB_WORKSPACE 'artifacts/PGame-TSManager-template.zip')
            (Join-Path $env:GITHUB_WORKSPACE 'artifacts/PGame-TSManager-universal.zip')
          )
          $extras = @(
            Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts/package-extras') -Filter '*.txt' |
              Where-Object { $_.Name -notin @('package-usage.zh-CN.txt', 'update-notes.txt') } |
              ForEach-Object { $_.FullName }
          )
          ./maintenance/tools/Add-ZipEntries.ps1 -ArchivePath $archives -FilePath $extras

      - name: Self-check repository packaging rules
        shell: pwsh
        run: ./maintenance/tools/Test-RepositoryLayout.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PGame-TSManager-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PGame-TSManager-*
          merge-multiple: true
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/package-extras/release-body.md
          files: |
            artifacts/*.zip
            artifacts/package-extras/package-usage.zh-CN.txt
            artifacts/package-extras/update-notes.txt

  publish-build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PGame-TSManager-*
          merge-multiple: true
          path: artifacts

      - name: Publish GitHub build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}-build.${{ github.run_number }}
          name: PGame-TSManager v${{ needs.build.outputs.version }} build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body_path: artifacts/package-extras/release-body.md
          prerelease: true
          make_latest: false
          files: |
            artifacts/*.zip
            artifacts/package-extras/package-usage.zh-CN.txt
            artifacts/package-extras/update-notes.txt
